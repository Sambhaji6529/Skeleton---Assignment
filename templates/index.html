<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Skeleton Mimicry</title>
    <style>
        /* General Styles */
        body {
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
            background-color: #121212;
            color: #f0f0f0;
            font-family: Arial, sans-serif;
            text-align: center;
        }

        h1 {
            margin-bottom: 20px;
            font-size: 2.5rem;
            color: #00ffcc;
        }

        /* Video Container Styles */
        .video-container {
            position: relative;
            width: 80%;
            max-width: 800px;
            border: 5px solid #00ffcc;
            border-radius: 10px;
            overflow: hidden;
            box-shadow: 0 4px 10px rgba(0, 0, 0, 0.8);
            background-color: #000;
        }

        img {
            width: 100%;
            height: auto;
            display: block;
        }

        /* Footer Styles */
        footer {
            margin-top: 20px;
            font-size: 14px;
            color: #aaa;
        }

        footer a {
            color: #00ffcc;
            text-decoration: none;
        }

        footer a:hover {
            text-decoration: underline;
        }
    </style>
</head>
<body>
    <h1>Real-Time Skeleton Mimicry</h1>
    <div class="video-container">
        <img src="/video_feed" alt="Real-time video feed" />
    </div>
    <footer>
        <p>Powered by <a href="#">Sam Developer</a></p>
    </footer>
</body>
</html>
